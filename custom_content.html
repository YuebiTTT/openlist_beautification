    <script>

    (function () {

        "use strict";


        /* =====================================================
        防重复执行
        ===================================================== */

        if (
            window.__OpenListVideoTheme
        ) {

            return;

        }


        window.__OpenListVideoTheme =
            true;


        /* =====================================================
        DOM
        ===================================================== */

        function $(id) {

            return document.getElementById(
                id
            );

        }


        /* =====================================================
        视频
        ===================================================== */
            
            function initVideo() {

                const video =
                    $("openlist-video-bg");


                if (!video) {

                    return;

                }


                /*
                * =====================================================
                * OpenList 视频背景地址
                * =====================================================
                */

                const LIGHT_VIDEO =
                    "/d/background/lemon.mp4?sign=SJ1nRwApCN05KdeUQqVy_VFqHULBOYJm90SthNojtRI=:0";


                const DARK_VIDEO =
                    "/d/background/wallpaper1.mp4?sign=CZfmr-3uWMGclLAiCLyRHgzUw1jcuKmy9CeWYPTddqw=:0";


                /*
                * =====================================================
                * 视频基础属性
                * =====================================================
                */

                video.muted =
                    true;

                video.loop =
                    true;

                video.playsInline =
                    true;


                /*
                * =====================================================
                * 判断当前主题
                * =====================================================
                */

                function isDarkMode() {

                    return document.body.classList.contains(
                        "hope-ui-dark"
                    );

                }


                /*
                * =====================================================
                * 设置视频
                * =====================================================
                */

                function setVideo(
                    force
                ) {

                    const target =
                        isDarkMode()
                            ? DARK_VIDEO
                            : LIGHT_VIDEO;


                    /*
                    * 如果已经是正确的视频，
                    * 不重复加载。
                    */

                    if (
                        !force &&
                        video.dataset.currentVideo ===
                            target
                    ) {

                        return;

                    }


                    video.dataset.currentVideo =
                        target;


                    /*
                    * 保存当前播放位置。
                    * 切换主题时尽量保持自然。
                    */

                    const oldTime =
                        video.currentTime || 0;


                    /*
                    * 淡出旧视频
                    */

                    video.style.opacity =
                        "0";


                    /*
                    * 停止当前视频
                    */

                    video.pause();


                    /*
                    * 更换 source
                    */

                    video.src =
                        target;


                    /*
                    * 重新加载
                    */

                    video.load();


                    /*
                    * 新视频可播放后淡入
                    */

                    video.addEventListener(
                        "canplay",
                        function () {

                            video.style.opacity =
                                "";

                        },
                        {
                            once: true
                        }
                    );


                    video.addEventListener(
                        "error",
                        function () {

                            video.style.opacity =
                                "";

                        },
                        {
                            once: true
                        }
                    );


                    /*
                    * 自动播放
                    */

                    const playPromise =
                        video.play();


                    if (
                        playPromise &&
                        typeof playPromise.catch ===
                        "function"
                    ) {

                        playPromise.catch(
                            function () {

                                /*
                                * 浏览器如果暂时阻止自动播放，
                                * 不做任何处理。
                                */

                            }
                        );

                    }


                    /*
                    * 尝试恢复播放位置
                    */

                    video.addEventListener(
                        "loadedmetadata",
                        function restorePosition() {

                            try {

                                if (
                                    oldTime > 0 &&
                                    oldTime <
                                    video.duration
                                ) {

                                    video.currentTime =
                                        oldTime;

                                }

                            } catch (e) {}


                            video.removeEventListener(
                                "loadedmetadata",
                                restorePosition
                            );

                        }
                    );

                }


                /*
                * =====================================================
                * 第一次设置
                * =====================================================
                */

                setVideo(
                    true
                );


                /*
                * =====================================================
                * 监听 OpenList 主题变化
                *
                * OpenList / Hope UI 会修改 body class：
                *
                * hope-ui-light
                * hope-ui-dark
                *
                * 所以 MutationObserver 可以实时检测。
                * =====================================================
                */

                const observer =
                    new MutationObserver(
                        function () {

                            setVideo(
                                false
                            );

                        }
                    );


                observer.observe(
                    document.body,
                    {
                        attributes:
                            true,

                        attributeFilter:
                            [
                                "class"
                            ]
                    }
                );


                /*
                * =====================================================
                * 某些情况下主题按钮可能修改 HTML / 根节点
                * 再监听 html，增加兼容性。
                * =====================================================
                */

                observer.observe(
                    document.documentElement,
                    {
                        attributes:
                            true,

                        attributeFilter:
                            [
                                "class"
                            ]
                    }
                );


                /*
                * =====================================================
                * 浏览器从后台回来后重新尝试播放
                * =====================================================
                */

                document.addEventListener(
                    "visibilitychange",
                    function () {

                        if (
                            document.visibilityState ===
                            "visible"
                        ) {

                            const promise =
                                video.play();


                            if (
                                promise &&
                                typeof promise.catch ===
                                "function"
                            ) {

                                promise.catch(
                                    function () {}
                                );

                            }

                        }

                    }
                );

            }

        /* =====================================================
        滚动效果
        ===================================================== */

        function initScroll() {

            const topbar =
                $("openlist-topbar");


            const topButton =
                $("openlist-top");


            if (!topbar) {

                return;

            }


            function update() {

                const scroll =
                    window.scrollY;


                if (
                    scroll > 35
                ) {

                    topbar.classList.add(
                        "scrolled"
                    );

                } else {

                    topbar.classList.remove(
                        "scrolled"
                    );

                }


                if (
                    topButton
                ) {

                    if (
                        scroll > 300
                    ) {

                        topButton.classList.add(
                            "show"
                        );

                    } else {

                        topButton.classList.remove(
                            "show"
                        );

                    }

                }

            }


            window.addEventListener(
                "scroll",
                update,
                {
                    passive:
                        true
                }
            );


            update();

        }


        /* =====================================================
        返回顶部
        ===================================================== */

        function initTop() {

            const top =
                $("openlist-top");


            const footerTop =
                $("openlist-footer-top");


            function scrollTop() {

                window.scrollTo({

                    top:
                        0,

                    behavior:
                        "smooth"

                });

            }


            if (top) {

                top.addEventListener(
                    "click",
                    scrollTop
                );

            }


            if (footerTop) {

                footerTop.addEventListener(
                    "click",
                    scrollTop
                );

            }

        }


        /* =====================================================
        搜索
        ===================================================== */

        function initSearch() {

            const button =
                $("openlist-search-button");


            const panel =
                $("openlist-search-panel");


            const input =
                $("openlist-search-input");


            if (
                !button ||
                !panel ||
                !input
            ) {

                return;

            }


            function openSearch() {

                panel.classList.add(
                    "open"
                );


                setTimeout(
                    function () {

                        input.focus();

                    },
                    80
                );

            }


            function closeSearch() {

                panel.classList.remove(
                    "open"
                );

            }


            button.addEventListener(
                "click",
                function () {

                    if (
                        panel.classList.contains(
                            "open"
                        )
                    ) {

                        closeSearch();

                    } else {

                        openSearch();

                    }

                }
            );


            /*
            * ESC
            */

            input.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key ===
                        "Escape"
                    ) {

                        closeSearch();

                        return;

                    }


                    if (
                        event.key ===
                        "Enter"
                    ) {

                        const keyword =
                            input.value.trim();


                        if (!keyword) {

                            return;

                        }


                        /*
                        * 找 OpenList 原生搜索框
                        */

                        const inputs =
                            document.querySelectorAll(
                                "input"
                            );


                        let target =
                            null;


                        for (
                            let i = 0;
                            i < inputs.length;
                            i++
                        ) {

                            const candidate =
                                inputs[i];


                            if (
                                candidate ===
                                input
                            ) {

                                continue;

                            }


                            const placeholder =
                                (
                                    candidate
                                        .placeholder ||
                                    ""
                                ).toLowerCase();


                            if (

                                placeholder.includes(
                                    "search"
                                ) ||

                                placeholder.includes(
                                    "搜索"
                                )
                            ) {

                                target =
                                    candidate;

                                break;

                            }

                        }


                        if (target) {

                            target.focus();

                            target.value =
                                keyword;


                            target.dispatchEvent(
                                new Event(
                                    "input",
                                    {
                                        bubbles:
                                            true
                                    }
                                )
                            );


                            target.dispatchEvent(
                                new KeyboardEvent(
                                    "keydown",
                                    {
                                        key:
                                            "Enter",

                                        bubbles:
                                            true
                                    }
                                )
                            );

                        }


                        closeSearch();

                    }

                }
            );


            /*
            * /
            * 快捷键
            */

            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key !== "/"
                    ) {

                        return;

                    }


                    const element =
                        document.activeElement;


                    if (
                        element &&
                        (
                            element.tagName ===
                            "INPUT" ||

                            element.tagName ===
                            "TEXTAREA"
                        )
                    ) {

                        return;

                    }


                    event.preventDefault();

                    openSearch();

                }
            );


            /*
            * 点击外面关闭
            */

            document.addEventListener(
                "click",
                function (event) {

                    if (
                        !panel.classList.contains(
                            "open"
                        )
                    ) {

                        return;

                    }


                    if (
                        panel.contains(
                            event.target
                        ) ||

                        button.contains(
                            event.target
                        )
                    ) {

                        return;

                    }


                    closeSearch();

                }
            );

        }


        /* =====================================================
        刷新
        ===================================================== */

        function initRefresh() {

            const button =
                $("openlist-refresh-button");


            if (!button) {

                return;

            }


            button.addEventListener(
                "click",
                function () {

                    button.style.transform =
                        "rotate(180deg)";


                    setTimeout(
                        function () {

                            location.reload();

                        },
                        180
                    );

                }
            );

        }


        /* =====================================================
        主题切换转场
        ===================================================== */

        function playThemeTransition(
            x,
            y,
            apply
        ) {

            const reduced =
                window.matchMedia(
                    "(prefers-reduced-motion: reduce)"
                ).matches;

            if (reduced) {

                apply();

                return;

            }


            /*
            * 优先使用 View Transitions API
            * 新主题画面从点击位置以圆形扩散开
            */

            if (
                document.startViewTransition
            ) {

                const beforeDark =
                    document.body.classList.contains(
                        "hope-ui-dark"
                    );

                const transition =
                    document.startViewTransition(
                        function () {

                            apply();

                            /*
                            * 等待主题 class 真正变化，
                            * 确保新快照是切换后的画面
                            */

                            return new Promise(
                                function (resolve) {

                                    const obs =
                                        new MutationObserver(
                                            function () {

                                                if (
                                                    document.body.classList.contains(
                                                        "hope-ui-dark"
                                                    ) !== beforeDark
                                                ) {

                                                    obs.disconnect();

                                                    resolve();

                                                }

                                            }
                                        );

                                    obs.observe(
                                        document.body,
                                        {
                                            attributes: true,

                                            attributeFilter:
                                                [
                                                    "class"
                                                ]
                                        }
                                    );

                                    setTimeout(
                                        function () {

                                            obs.disconnect();

                                            resolve();

                                        },
                                        350
                                    );

                                }
                            );

                        }
                    );

                transition.ready
                    .then(function () {

                        const r =
                            Math.ceil(
                                Math.hypot(
                                    Math.max(
                                        x,
                                        window.innerWidth - x
                                    ),

                                    Math.max(
                                        y,
                                        window.innerHeight - y
                                    )
                                ) * 1.05
                            );

                        document.documentElement.animate(
                            [
                                {
                                    clipPath:
                                        "circle(0px at " + x + "px " + y + "px)",

                                    transform: "scale(1.16)",

                                    filter:
                                        "brightness(1.7) saturate(1.6)",

                                    easing:
                                        "cubic-bezier(0.6, 0, 0.9, 0.4)"
                                },

                                {
                                    clipPath:
                                        "circle(" +
                                        Math.round(r * 0.24) +
                                        "px at " +
                                        x +
                                        "px " +
                                        y +
                                        "px)",

                                    transform: "scale(1.06)",

                                    filter:
                                        "brightness(1.3) saturate(1.25)",

                                    offset: 0.4,

                                    easing:
                                        "cubic-bezier(0.1, 0.7, 0.15, 1)"
                                },

                                {
                                    clipPath:
                                        "circle(" + r + "px at " + x + "px " + y + "px)",

                                    transform: "scale(1)",

                                    filter:
                                        "brightness(1) saturate(1)"
                                }
                            ],
                            {
                                duration: 1000,

                                pseudoElement:
                                    "::view-transition-new(root)"
                            }
                        );

                        document.documentElement.animate(
                            [
                                {
                                    transform: "scale(1)",

                                    filter: "blur(0px)",

                                    opacity: 1
                                },

                                {
                                    transform: "scale(1.08)",

                                    filter: "blur(10px)",

                                    opacity: 0.35
                                }
                            ],
                            {
                                duration: 1000,

                                easing:
                                    "cubic-bezier(0.5, 0, 0.2, 1)",

                                pseudoElement:
                                    "::view-transition-old(root)"
                            }
                        );

                    })
                    .catch(function () {});

                return;

            }

            fallbackThemeTransition(
                x,
                y,
                apply
            );

        }


        /* =====================================================
        主题切换转场
        Fallback 时空扭曲 + 冲击波
        ===================================================== */

        function buildThemeFx(x, y, toDark) {

            const old =
                document.getElementById(
                    "openlist-theme-fx"
                );

            if (old) {

                old.remove();

            }

            const size =
                Math.ceil(
                    Math.hypot(
                        Math.max(
                            x,
                            window.innerWidth - x
                        ),

                        Math.max(
                            y,
                            window.innerHeight - y
                        )
                    ) * 2.6
                );

            const geo =
                "left:" + x + "px;" +
                "top:" + y + "px;" +
                "width:" + size + "px;" +
                "height:" + size + "px;";

            const fx =
                document.createElement("div");

            fx.id = "openlist-theme-fx";

            fx.className = toDark
                ? "to-dark"
                : "to-light";

            fx.style.setProperty(
                "--fx-x",
                x + "px"
            );

            fx.style.setProperty(
                "--fx-y",
                y + "px"
            );

            fx.innerHTML =
                '<div class="fx-core" style="' + geo + '"></div>' +
                '<div class="fx-ring fx-ring-1" style="' + geo + '"></div>' +
                '<div class="fx-ring fx-ring-2" style="' + geo + '"></div>' +
                '<div class="fx-ring fx-ring-3" style="' + geo + '"></div>' +
                '<div class="fx-flash"></div>';

            document.body.appendChild(fx);

            return fx;

        }


        function fallbackThemeTransition(x, y, apply) {

            const toDark =
                !document.body.classList.contains(
                    "hope-ui-dark"
                );

            const fx =
                buildThemeFx(x, y, toDark);

            const root =
                document.documentElement;

            root.classList.add(
                "openlist-theme-warp"
            );

            requestAnimationFrame(function () {

                fx.classList.add("run");

            });

            /*
            * 全屏被能量核心覆盖时切换主题
            */

            setTimeout(apply, 430);

            /*
            * 揭示新主题
            */

            setTimeout(function () {

                fx.classList.add("reveal");

                root.classList.remove(
                    "openlist-theme-warp"
                );

            }, 530);

            setTimeout(function () {

                fx.remove();

            }, 1500);

        }


        /* =====================================================
        Theme
        ===================================================== */

        function initTheme() {

            const button =
                $("openlist-theme-button");


            const footer =
                $("openlist-footer-theme");


            function apply() {

                /*
                * 寻找 OpenList 原生主题按钮
                */

                const buttons =
                    document.querySelectorAll(
                        "button"
                    );


                for (
                    let i = 0;
                    i < buttons.length;
                    i++
                ) {

                    const candidate =
                        buttons[i];


                    if (
                        candidate ===
                        button ||

                        candidate ===
                        footer
                    ) {

                        continue;

                    }


                    const label =
                        (
                            candidate
                                .getAttribute(
                                    "aria-label"
                                ) ||

                            candidate
                                .getAttribute(
                                    "title"
                                ) ||

                            candidate
                                .innerText ||

                            ""
                        ).toLowerCase();


                    if (

                        label.includes(
                            "theme"
                        ) ||

                        label.includes(
                            "dark"
                        ) ||

                        label.includes(
                            "light"
                        ) ||

                        label.includes(
                            "主题"
                        )
                    ) {

                        candidate.click();

                        return;

                    }

                }


                /*
                * Fallback
                */

                const dark =
                    document.body.classList.contains(
                        "hope-ui-dark"
                    );


                if (dark) {

                    document.body.classList.remove(
                        "hope-ui-dark"
                    );

                    document.body.classList.add(
                        "hope-ui-light"
                    );

                } else {

                    document.body.classList.remove(
                        "hope-ui-light"
                    );

                    document.body.classList.add(
                        "hope-ui-dark"
                    );

                }

            }


            /*
            * 转场入口：
            * 从点击位置开始播放主题切换转场
            */

            function toggle(event) {

                const x =
                    event && event.clientX
                        ? event.clientX
                        : window.innerWidth / 2;

                const y =
                    event && event.clientY
                        ? event.clientY
                        : window.innerHeight / 2;

                playThemeTransition(
                    x,
                    y,
                    apply
                );

            }


            if (button) {

                button.addEventListener(
                    "click",
                    toggle
                );
            }


            if (footer) {

                footer.addEventListener(
                    "click",
                    toggle
                );
            }

        }


        /* =====================================================
        更多
        ===================================================== */

        function initMore() {

            const button = $("openlist-more-button");

            if (!button) {
                return;
            }

            /*
            * 防止重复创建
            */
            let menu = $("openlist-more-menu");

            if (menu) {
                return;
            }

            /*
            * 当前 OpenList 域名
            *
            * 例如：
            * https://example.com
            *
            * 自动变成：
            * OpenWrt       -> http(s)://example.com/
            * qBittorrent   -> http(s)://example.com:8081
            * Clash         -> http(s)://example.com:9090
            */
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;

            const baseUrl =
                protocol + "//" + hostname;

            /*
            * 管理后台
            */
            const manageUrl =
                baseUrl + ":5244/@manage";

            /*
            * 快捷菜单
            */
            menu = document.createElement("div");

            menu.id = "openlist-more-menu";

            menu.innerHTML = `

                <div
                    class="openlist-more-title"
                >
                    快捷入口
                </div>

                <a
                    class="openlist-more-item"
                    href="${manageUrl}"
                >
                    <span class="openlist-more-icon">
                        ⚙
                    </span>

                    <span class="openlist-more-text">
                        <strong>管理后台</strong>
                        <small>OpenList 管理中心</small>
                    </span>

                    <span class="openlist-more-arrow">
                        ›
                    </span>
                </a>

                <a
                    class="openlist-more-item"
                    href="${baseUrl}/"
                >
                    <span class="openlist-more-icon">
                        ◈
                    </span>

                    <span class="openlist-more-text">
                        <strong>OpenWrt</strong>
                        <small>路由器管理</small>
                    </span>

                    <span class="openlist-more-arrow">
                        ›
                    </span>
                </a>

                <a
                    class="openlist-more-item"
                    href="${baseUrl}:8081"
                >
                    <span class="openlist-more-icon">
                        ⬇
                    </span>

                    <span class="openlist-more-text">
                        <strong>qBittorrent</strong>
                        <small>下载管理</small>
                    </span>

                    <span class="openlist-more-arrow">
                        ›
                    </span>
                </a>

                <a
                    class="openlist-more-item"
                    href="${baseUrl}:9090"
                >
                    <span class="openlist-more-icon">
                        ◉
                    </span>

                    <span class="openlist-more-text">
                        <strong>Clash</strong>
                        <small>代理控制面板</small>
                    </span>

                    <span class="openlist-more-arrow">
                        ›
                    </span>
                </a>

            `;

            document.body.appendChild(menu);


            /*
            * 打开 / 关闭菜单
            */
            button.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    const isOpen =
                        menu.classList.contains(
                            "open"
                        );

                    /*
                    * 关闭其他状态
                    */
                    document
                        .querySelectorAll(
                            ".openlist-more-menu.open"
                        )
                        .forEach(
                            function (item) {

                                item.classList.remove(
                                    "open"
                                );

                            }
                        );

                    if (!isOpen) {

                        /*
                        * 计算按钮位置
                        */
                        const rect =
                            button.getBoundingClientRect();

                        menu.style.top =
                            (
                                rect.bottom + 10
                            ) + "px";

                        /*
                        * 桌面端右对齐
                        */
                        menu.style.right =
                            (
                                window.innerWidth -
                                rect.right
                            ) + "px";

                        menu.classList.add(
                            "open"
                        );

                    }

                }
            );


            /*
            * 点击菜单内部
            *
            * 不让事件继续冒泡
            */
            menu.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                }
            );


            /*
            * 点击页面其他地方关闭
            */
            document.addEventListener(
                "click",
                function () {

                    menu.classList.remove(
                        "open"
                    );

                }
            );


            /*
            * ESC 关闭
            */
            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Escape"
                    ) {

                        menu.classList.remove(
                            "open"
                        );

                    }

                }
            );


            /*
            * 窗口变化时重新定位
            */
            window.addEventListener(
                "resize",
                function () {

                    if (
                        !menu.classList.contains(
                            "open"
                        )
                    ) {
                        return;
                    }

                    const rect =
                        button.getBoundingClientRect();

                    menu.style.top =
                        (
                            rect.bottom + 10
                        ) + "px";

                    menu.style.right =
                        (
                            window.innerWidth -
                            rect.right
                        ) + "px";

                }
            );

        }
            
        /* =====================================================
        初始化
        ===================================================== */

        function init() {

            initVideo();

            initScroll();

            initTop();

            initSearch();

            initRefresh();

            initTheme();

            initMore();

        }


        /*
        * 等 OpenList React 页面初始化
        */

        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                function () {

                    setTimeout(
                        init,
                        1000
                    );

                }
            );

        } else {

            setTimeout(
                init,
                1000
            );

        }

    })();

    </script>
